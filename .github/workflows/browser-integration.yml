name: Chrome Extension Integration

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulated-chrome:
    name: Installed Manifest V3 extension against synthetic ChatGPT tabs
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and bundled Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise real extension and tab-local CDP input
        timeout-minutes: 3
        run: python -u tests/browser-smoke.py
