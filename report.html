<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ChatGPT Autopilot Report</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px system-ui;max-width:1050px;margin:30px auto;padding:0 18px;background:#f7f8fa;color:#17212b}h1{margin-bottom:8px}.box{background:white;border:1px solid #dce0e5;border-radius:10px;padding:20px;margin:14px 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e1e5eb;text-align:left;padding:8px}button{padding:9px 12px;border:1px solid #aaa;border-radius:6px;background:white;cursor:pointer}small{color:#556}code{font-size:12px}</style></head><body><h1>ChatGPT Tab Autopilot</h1><p>Local status and event history. Nothing here is uploaded to a server.</p><div class="box"><strong id="status">Loading…</strong> <button id="refresh">Refresh</button> <button id="export">Export JSON</button> <button id="clear">Clear events</button></div><div class="box"><h2>Conversations</h2><table><thead><tr><th>Tab</th><th>Phase</th><th>Sent</th><th>Explanation</th></tr></thead><tbody id="tabs"></tbody></table></div><div class="box"><h2>Events (latest first)</h2><table><thead><tr><th>Time</th><th>Tab</th><th>Event</th><th>Details</th></tr></thead><tbody id="events"></tbody></table></div><script src="report.js"></script></body></html>
